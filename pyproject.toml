[project]
name = "debriefgc"
version = "0.1.0"
description = "Local Mac MVP for daily iMessage group chat AI debriefs with summary memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi",
]

[project.scripts]
debriefgc = "debriefgc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["debriefgc*"]
